# MenuBoard Editor — serve the SPA static files and PHP API from the custom directory.
# Included via IncludeOptional /etc/apache2/conf.d/*.conf (outside VirtualHost is valid for Alias).
Alias /menuboard-editor/ /var/www/cms/custom/MenuBoard/editor/
<Directory /var/www/cms/custom/MenuBoard/editor/>
    Options -Indexes +FollowSymLinks -MultiViews
    AllowOverride None
    Require all granted
</Directory>
